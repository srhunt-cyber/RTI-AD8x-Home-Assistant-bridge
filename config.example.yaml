# RTI AD-series MQTT Bridge configuration
schema_version: 1

bridge:
  log_level: INFO
  health_check_interval: 30

mqtt:
  host: 192.0.2.10
  port: 1883
  username: ""
  # A literal password works, or use ${RTI_MQTT_PASSWORD} and set that variable.
  password: ""
  base_topic: rti/ad8x
  discovery_prefix: homeassistant

polling:
  interval: 60
  connect_timeout: 2
  reply_timeout: 3
  inter_command_delay: 0.20
  reconnect_delay: 5
  failure_threshold: 3

commands:
  post_send_settle: 0.05
  retries: 2
  retry_delay: 0.2
  coalesce_window: 1.2
  # Tone DSP changes need substantially longer than power/source/volume.
  tone_settle_delay: 6.0
  echo_suppress: 1.0
  power_on_fallback_volume: 65

home_assistant:
  discovery: true
  # Leave false to preserve the numeric source options used by v1.8.x.
  use_source_names: false
  # legacy: existing switch/number/select entities only (default)
  # dual: keep legacy entities and add the generated media_player package
  # media_player: generated media players only; install the package first
  entity_mode: legacy
  media_players:
    include: all
    name_suffix: Speakers
    # Alexa/media-card 0..100% maps safely into this existing RTI display range.
    volume_min: 5
    volume_max: 40
    volume_step: 1

# Optional amplifier-default restoration. Keep dry_run true until CHECK and a
# single ZONE test have been reviewed. Volume uses the existing HA/display
# scale (20 sends RTI attenuation 55); tone values must be even numbers.
restoration:
  enabled: false
  automatic: false
  dry_run: true
  confirmation_polls: 2
  command_delay: 5
  verification_attempts: 4
  factory_signature:
    bass: 0
    treble: 0
    # Omit volume unless its factory value has been verified on your hardware.
    # volume: 45
    # Zero means every restore-enabled zone on the amplifier must match.
    minimum_matching_zones: 0
  defaults:
    volume: 20
    bass: 8
    treble: 12
    # This input must be unused or silent during unattended calibration.
    safe_source: 8
    ready_source: 1
    leave_powered_off: true

amps:
  - id: amp1
    name: Main Floor Amplifier
    model: AD-8x
    host: 192.0.2.82
    port: 23
    startup_delay: 0
    sources:
      1: Sonos 1
      2: Sonos 2
      3: Source 3
      4: Source 4
      5: Source 5
      6: Source 6
      7: Source 7
      8: Source 8
    zones:
      1: Kitchen
      2: Great Room
      3: Upper Deck
      4: Master Bed
      5: Master Bath
      6: Mom's Room
      7: Office
      8: Craft Room
      # Object form permits a room-specific override without renumbering it:
      # 8:
      #   name: Craft Room
      #   defaults:
      #     bass: 10
      #     treble: 12

  - id: amp2
    name: Lower Floor Amplifier
    model: AD-8x
    host: 192.0.2.61
    port: 23
    startup_delay: 5
    zones:
      1: Laundry
      2: Lower Bar
      3: Golf Room
      4: Lower Guest
      5: Fitness
      6: Walkout
      7: Pool
      8: Patio
